name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:18.6
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: security_test
          POSTGRES_DB: review_pilot_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_test -d review_pilot_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Deployment contracts
        run: pnpm test:deployment

      - name: Unit tests (mocked providers and database)
        run: pnpm test

      - name: PostgreSQL adapter integration (disposable CI database)
        env:
          DB_TEST_DATABASE_URL: postgresql://security_test:security_test@127.0.0.1:5432/review_pilot_security_test
        run: pnpm test:database

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm -r build
