# Production configuration. Defaults to standby; activate only during approved cutover.
x-runtime: &runtime
  image: review-pilot:${REVIEW_PILOT_IMAGE_TAG:-coolify-production}
  build:
    context: .
    args:
      API_PROXY_URL: http://api:4000
      PUBLIC_WEB_ORIGIN: https://reviews.shakingcrab.net
  entrypoint: [sh, /app/scripts/production-entrypoint.sh]
  init: true
  restart: unless-stopped
  stop_grace_period: 90s

x-environment: &environment
  NODE_ENV: production
  REVIEW_PILOT_ENV: live
  DATABASE_URL: postgresql://review_pilot:${POSTGRES_PASSWORD:?}@postgres:5432/review_pilot
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  APP_SECRET_KEY: ${APP_SECRET_KEY:?}
  OWNER_SESSION_SECRET: ${OWNER_SESSION_SECRET:?}
  WEB_ORIGIN: https://reviews.shakingcrab.net
  PUBLIC_BASE_URL: https://reviews.shakingcrab.net
  REVIEW_PILOT_PRODUCTION_ACTIVE: ${REVIEW_PILOT_PRODUCTION_ACTIVE:-false}
  REVIEW_PILOT_OAUTH_SETUP_ENABLED: ${REVIEW_PILOT_OAUTH_SETUP_ENABLED:-false}
  REVIEW_SYNC_SCHEDULER_ENABLED: ${REVIEW_SYNC_SCHEDULER_ENABLED:-true}
  REVIEW_SYNC_AUTO_GENERATE_ENABLED: ${REVIEW_SYNC_AUTO_GENERATE_ENABLED:-true}
  NOTIFICATION_SCHEDULER_ENABLED: "false"
  CODEX_HOME: /app/review-pilot-state/codex-home
  CODEX_WORKDIR: /app/review-pilot-state/codex-workdir
  OWNER_PASSWORD_NOTE_PATH: /app/review-pilot-state/OWNER_PASSWORD.local.md
  SEMANTIC_WORKER_CONCURRENCY: "1"
  NOTIFICATION_WORKER_CONCURRENCY: "2"
  WEBHOOK_WORKER_CONCURRENCY: "4"
  NODE_OPTIONS: --max-old-space-size=384

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: review_pilot
      POSTGRES_USER: review_pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U review_pilot -d review_pilot"]
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.2.9-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes:
      - redis-data:/data
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    <<: *runtime
    restart: "no"
    environment: *environment
    command: [pnpm, db:deploy]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *runtime
    environment:
      <<: *environment
      PORT: "4000"
      HOSTNAME: 0.0.0.0
      TRUST_PROXY: "true"
    command: [node, apps/api/dist/apps/api/src/main.js]
    expose: ["4000"]
    networks:
      default: {}
      coolify:
        aliases: [review-pilot-api]
    volumes:
      - runtime-state:/app/review-pilot-state
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  worker:
    <<: *runtime
    environment: *environment
    command: [node, apps/worker/dist/apps/worker/src/main.js]
    volumes:
      - runtime-state:/app/review-pilot-state
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  web:
    <<: *runtime
    environment:
      NODE_ENV: production
      API_PROXY_URL: http://api:4000
      REVIEW_PILOT_ENV: live
      REVIEW_PILOT_PRODUCTION_ACTIVE: ${REVIEW_PILOT_PRODUCTION_ACTIVE:-false}
      NODE_OPTIONS: --max-old-space-size=256
    working_dir: /app/apps/web
    command: [node, node_modules/next/dist/bin/next, start, -H, 0.0.0.0, -p, "3000"]
    expose: ["3000"]
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  coolify:
    external: true
    name: coolify

volumes:
  postgres-data:
  redis-data:
  runtime-state:
